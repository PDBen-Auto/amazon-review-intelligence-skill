name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python scripts
        run: python -m compileall -q scripts tests

      - name: Validate skill structure and links
        run: python tests/test_skill_structure.py

      - name: Run Excel export regression fixture
        run: python tests/test_export_reviews.py

      - name: Run local receiver security regression
        run: python tests/test_local_json_receiver.py

      - name: Validate the complete synthetic case
        run: python tests/test_synthetic_demo.py

      - name: Smoke-test installable ZIP layout
        run: python tests/test_install_smoke.py
