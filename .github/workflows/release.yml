name: Publish installable skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and validate
        run: |
          python -m pip install -r requirements.txt
          python -m pip install cryptography
          python -m compileall -q scripts tests examples/synthetic-demo
          python tests/test_skill_structure.py
          python tests/test_export_reviews.py
          python tests/test_local_json_receiver.py
          python tests/test_synthetic_demo.py
          python tests/test_install_smoke.py

      - name: Package installable skill
        shell: bash
        run: |
          mkdir -p dist/amazon-review-scraper
          git archive --format=tar "${GITHUB_SHA}" | tar -x -C dist/amazon-review-scraper
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -type f -name '*.pyc' -delete
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import load_pem_public_key
          root = Path("dist/amazon-review-scraper")
          manifest = (root / "PUBLIC_MANIFEST.sha256").read_text(encoding="utf-8")
          payload = json.loads((root / "RELEASE_PROVENANCE.json").read_text(encoding="utf-8"))
          assert hashlib.sha256(manifest.encode()).hexdigest() == payload["manifest_sha256"]
          for line in manifest.splitlines():
              digest, relative = line.split("  ", 1)
              assert hashlib.sha256((root / relative).read_bytes()).hexdigest() == digest, relative
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          signature = base64.b64decode((root / "RELEASE_PROVENANCE.sig").read_text().strip(), validate=True)
          load_pem_public_key((root / "PUBLISHER_PUBLIC_KEY.pem").read_bytes()).verify(signature, canonical)
          PY
          cd dist
          zip -r amazon-review-intelligence-skill.zip amazon-review-scraper
          sha256sum amazon-review-intelligence-skill.zip > amazon-review-intelligence-skill.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/amazon-review-intelligence-skill.zip
          dist/amazon-review-intelligence-skill.zip.sha256
          --repo "${{ github.repository }}"
          --title "Amazon Review Intelligence Skill ${{ github.ref_name }}"
          --generate-notes
