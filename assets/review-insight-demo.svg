<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Amazon review insight dashboard synthetic demo</title>
  <desc id="desc">Synthetic review analysis output showing review count, rating, issue bars, customer voice and product actions.</desc>
  <style>
    .bg{fill:#f7f8fa}.panel{fill:#fff;stroke:#e3e7ed;stroke-width:1}.ink{fill:#17212f;font-family:Arial,"Microsoft YaHei",sans-serif}.muted{fill:#637083;font-family:Arial,"Microsoft YaHei",sans-serif}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:19px}.h2{font-size:25px;font-weight:700}.h1{font-size:31px;font-weight:700}.num{font-size:34px;font-weight:700}.green{fill:#1f8f68}.red{fill:#d5544f}.blue{fill:#3467d6}.amber{fill:#c88424}.barbg{fill:#edf0f4}
  </style>
  <rect class="bg" width="1280" height="760"/>
  <rect x="30" y="26" width="1220" height="84" rx="8" class="panel"/>
  <text x="62" y="61" class="ink h1">Portable Car Fan · Review Intelligence</text>
  <text x="62" y="89" class="muted small">Synthetic demo · 2026-09-18 · written reviews only · no real ASIN</text>
  <rect x="1040" y="48" width="178" height="34" rx="17" fill="#fff5e6"/>
  <text x="1129" y="71" text-anchor="middle" class="amber small">合成数据演示</text>
  <g transform="translate(30,132)"><rect width="285" height="112" rx="8" class="panel"/><text x="22" y="32" class="muted small">去重后 written reviews</text><text x="22" y="78" class="ink num">486</text><text x="116" y="78" class="green body">+32%</text></g>
  <g transform="translate(335,132)"><rect width="285" height="112" rx="8" class="panel"/><text x="22" y="32" class="muted small">平均评分</text><text x="22" y="78" class="ink num">4.1</text><text x="103" y="78" class="muted body">/ 5.0</text></g>
  <g transform="translate(640,132)"><rect width="285" height="112" rx="8" class="panel"/><text x="22" y="32" class="muted small">负面主类占比</text><text x="22" y="78" class="red num">38%</text><text x="128" y="78" class="muted body">1-3 星</text></g>
  <g transform="translate(945,132)"><rect width="305" height="112" rx="8" class="panel"/><text x="22" y="32" class="muted small">数据边界</text><text x="22" y="70" class="ink body">样本 ≠ 全部 ratings</text><text x="22" y="93" class="muted tiny">每条评论只计入一个主类</text></g>
  <rect x="30" y="270" width="590" height="446" rx="8" class="panel"/>
  <text x="58" y="310" class="ink h2">负面问题优先级</text><text x="58" y="336" class="muted tiny">基于 1-3 星样本的单评论主类归因</text>
  <text x="58" y="380" class="ink body">夹具松动 / 易滑</text><rect x="250" y="363" width="290" height="22" rx="11" class="barbg"/><rect x="250" y="363" width="241" height="22" rx="11" class="red"/><text x="555" y="380" class="muted small">31%</text>
  <text x="58" y="438" class="ink body">低速噪音偏大</text><rect x="250" y="421" width="290" height="22" rx="11" class="barbg"/><rect x="250" y="421" width="187" height="22" rx="11" fill="#e77b55"/><text x="555" y="438" class="muted small">24%</text>
  <text x="58" y="496" class="ink body">线材过短</text><rect x="250" y="479" width="290" height="22" rx="11" class="barbg"/><rect x="250" y="479" width="132" height="22" rx="11" class="amber"/><text x="555" y="496" class="muted small">17%</text>
  <text x="58" y="554" class="ink body">说明书不清晰</text><rect x="250" y="537" width="290" height="22" rx="11" class="barbg"/><rect x="250" y="537" width="101" height="22" rx="11" fill="#d5a23d"/><text x="555" y="554" class="muted small">13%</text>
  <text x="58" y="612" class="ink body">其他</text><rect x="250" y="595" width="290" height="22" rx="11" class="barbg"/><rect x="250" y="595" width="116" height="22" rx="11" fill="#a9b4c2"/><text x="555" y="612" class="muted small">15%</text>
  <rect x="58" y="652" width="510" height="42" rx="6" fill="#fff5f4"/><text x="78" y="679" class="red small">HIGH：先验证夹具结构与低速风道噪音，再优化线材和说明书</text>
  <rect x="650" y="270" width="600" height="446" rx="8" class="panel"/>
  <text x="680" y="310" class="ink h2">从原声到产品动作</text><text x="680" y="346" class="muted small">用户原声（合成）</text>
  <rect x="680" y="362" width="540" height="90" rx="6" fill="#f4f7fb"/><text x="700" y="393" class="ink body">“长途开车时风量够，但夹在出风口上会慢慢下滑。”</text><text x="700" y="425" class="muted small">2 星 · 合成原声 · 可回链</text>
  <text x="680" y="492" class="muted small">产品改进假设</text><text x="680" y="526" class="ink body">1. 增加防滑硅胶接触面，验证 3 种出风口结构</text><text x="680" y="562" class="ink body">2. 调整低速叶轮与电机支撑，目标噪音下降 3 dB</text><text x="680" y="598" class="ink body">3. Listing 明示“USB 供电、无内置电池”</text>
  <rect x="680" y="638" width="540" height="48" rx="6" fill="#edf8f3"/><text x="700" y="668" class="green small">下一步：结构样机 + 20 位目标用户验证，而非直接假设为总体比例</text>
</svg>
